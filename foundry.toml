[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 999999
via_ir = true
solc = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"
verbosity = 2
ffi = true
fs_permissions = [
  { access = "read-write", path = ".forge-snapshots"},
  { access = "read", path = "script/" }
]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@chainlink/=lib/foundry-chainlink-toolkit/src/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/",
]

additional_compiler_profiles = [
  { name = "test", via_ir = false, optimizer = false }
]

compilation_restrictions = [
  { paths = "test/**", via_ir = false, optimizer = false }
]

[profile.default.fuzz]
runs = 1000

[profile.pr.fuzz]
runs = 10000

[profile.ci.fuzz]
runs = 100000

[profile.debug]
via_ir = false
optimizer_runs = 200
fuzz.runs = 100

# ── RPC Endpoints ──
# Loaded from .env.local via ${} interpolation.
# Usage in tests: vm.createSelectFork("base_mainnet")
# Usage on CLI:   forge test --fork-url base_mainnet
[rpc_endpoints]
base_mainnet = "${BASE_MAINNET_RPC}"
base_sepolia = "https://sepolia.base.org"

# ── Etherscan / Basescan for verification ──
[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }

[fmt]
line_length = 120
tab_width = 4
quote_style = "single"
sort_imports = true
number_underscore = "thousands"
